name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  test:
    name: Lint, Unit Tests & CLI Checks
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --prefer-offline

      - name: Run Tests & ESLint
        run: yarn test

      - name: Verify CLI execution
        run: |
          ./bin/run.js --version
          ./bin/run.js --help
          ./bin/run.js congratulate --help

  docker:
    name: Docker Build & Compose Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Docker image
        run: docker build -t fb-birthday-gratulator:ci .

      - name: Verify CLI inside container
        run: |
          docker run --rm fb-birthday-gratulator:ci congratulate --help
